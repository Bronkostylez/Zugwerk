name: Deploy Zugwerk
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract source
        run: cat source.part*.b64 | base64 -d > source.zip && unzip -q source.zip
      - name: Install and test
        working-directory: zugwerk
        run: |
          npm ci
          cp node_modules/stockfish/bin/stockfish-19-lite-single.wasm public/engine/
          curl -fL https://codeload.github.com/nmrugg/stockfish.js/tar.gz/refs/tags/v19.0.1 -o public/licenses/stockfish.js-v19.0.1-source.tar.gz
          curl -fL https://tests.stockfishchess.org/api/nn/nn-61e7af4bb97d.nnue -o public/licenses/nn-61e7af4bb97d.nnue
          echo "61e7af4bb97d51eeeb25d322916f86513b5cd3a827ce189c98c6e31946f99e5b  public/licenses/nn-61e7af4bb97d.nnue" | sha256sum -c
          npm test
      - name: Build
        working-directory: zugwerk
        run: |
          sed -i "s/PRIVATE VORSCHAU · 0.2/ÖFFENTLICHE BETA · 0.2.1/" index.html
          sed -i "s/✅ Fertig/Fertig/; s/🧠 Analysiere/Analysiere/" app.js
          npm run build
          zip -qr dist/zugwerk-source.zip . -x "node_modules/*" "dist/*"
          cp README.md dist/README.md
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: zugwerk/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
